# ─────────────────────────────────────────────────────────────────────────────
# DEPLOYMENT STRATEGY 03: Docker Microservices – Optimized Builds
# FintechBank – Fintech Scalability Challenge
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

networks:
  fintech-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  fintech-external:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

services:
  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../../app/frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
      cache_from:
        - registry.fintech.dev/fintech-frontend:latest
    image: registry.fintech.dev/fintech-frontend:${APP_VERSION:-latest}
    container_name: fintech-frontend
    networks:
      - fintech-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Backend API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ../../app/backend
      dockerfile: Dockerfile
      target: production
      cache_from:
        - registry.fintech.dev/fintech-api:latest
    image: registry.fintech.dev/fintech-api:${APP_VERSION:-latest}
    container_name: fintech-api
    networks:
      - fintech-internal
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=https://fintech.dev
    env_file:
      - ../../.env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - redis
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: fintech-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    networks:
      - fintech-internal
      - fintech-external
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ── Redis Cache ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fintech-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    networks:
      - fintech-internal
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
