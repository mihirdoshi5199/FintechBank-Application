# ─────────────────────────────────────────────────────────────────────────────
# DEPLOYMENT STRATEGY 10: Production-Grade Launch – Final Stage
# FintechBank – Fintech Scalability Challenge
# Full production stack: API + Frontend + Nginx + Redis + Monitoring + Vault
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

x-restart-policy: &restart-policy
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
    window: 120s

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"
    labels: "service,version,environment"

networks:
  fintech-internal:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 172.20.0.0/24
  fintech-external:
    driver: overlay
  monitoring:
    driver: overlay

volumes:
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local

secrets:
  jwt_secret:
    external: true
  redis_password:
    external: true
  registry_password:
    external: true

configs:
  nginx_config:
    file: ../02-nginx-proxy/nginx.conf
  prometheus_config:
    file: ../08-monitoring-grafana/prometheus.yml

services:
  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    image: ${REGISTRY_HOST}/fintech-frontend:${APP_VERSION:-latest}
    networks:
      - fintech-internal
    deploy:
      replicas: 2
      <<: *restart-policy
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        failure_action: pause
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # ── Backend API ──────────────────────────────────────────────────────────
  api:
    image: ${REGISTRY_HOST}/fintech-api:${APP_VERSION:-latest}
    networks:
      - fintech-internal
    environment:
      - NODE_ENV=production
      - PORT=4000
      - APP_VERSION=${APP_VERSION:-latest}
      - ALLOWED_ORIGINS=https://fintech.dev
    secrets:
      - jwt_secret
      - redis_password
    deploy:
      replicas: 4
      <<: *restart-policy
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.1
        order: start-first
      rollback_config:
        parallelism: 2
        delay: 5s
        failure_action: pause
        monitor: 30s
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
      placement:
        constraints:
          - node.role == worker
          - node.labels.env == production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=50m,mode=1777
    logging: *default-logging

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    networks:
      - fintech-internal
      - fintech-external
    deploy:
      replicas: 2
      <<: *restart-policy
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
      placement:
        constraints:
          - node.role == manager
    depends_on:
      - api
      - frontend
    logging: *default-logging

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      sh -c 'redis-server
      --requirepass "$$(cat /run/secrets/redis_password)"
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 300 1
      --save 60 100
      --appendonly yes
      --loglevel warning'
    volumes:
      - redis_data:/data
    networks:
      - fintech-internal
    secrets:
      - redis_password
    deploy:
      replicas: 1
      <<: *restart-policy
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - fintech-internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
    logging: *default-logging

  # ── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/redis_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    logging: *default-logging
