# ─────────────────────────────────────────────────────────────────────────────
# Prometheus Configuration – FintechBank
# ─────────────────────────────────────────────────────────────────────────────
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "fintech-prod"
    env: "production"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "fintech-api"
    static_configs:
      - targets: ["api:4000"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    scrape_interval: 20s

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
